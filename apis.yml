name: Verdex
description: >-
  Verdex builds AI for the clinical workflow. Its first product rooms patients
  and takes their history by voice before the physician walks into the room: the
  agent gathers and organizes the patient's story, hands the physician a
  three-sentence summary, and lands a structured, signable history back in the
  electronic health record (EHR) the practice already runs. The agent never
  diagnoses or advises, escalates anything urgent to staff immediately, keeps
  every line of the note traceable to its source, and is built to be HIPAA
  compliant. Verdex is aimed at clinicians, practice owners, and health-system
  teams. The company is an early-stage Y Combinator startup; verdexai.com is a
  browser-rendered marketing site that publishes machine-readable llms.txt,
  robots.txt, and a security.txt but does not (yet) expose a public API,
  developer portal, SDKs, or OpenAPI surface.
